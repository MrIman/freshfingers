<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-6-date-rooms.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Phudu:wght@700&family=Barlow+Condensed:wght@700&family=Chivo+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2304px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- FRESH FINGERS wordmark, heavy black condensed caps --><p style="font-size:var(--r-wordmark-font);font-family:var(--r-wordmark-family),sans-serif;font-weight:var(--r-wordmark-weight);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-tagline region text" data-region="tagline"><!-- CLEAN HABITS. BRIGHTER DAYS. tiny tracked caps under the wordmark --><p style="font-size:var(--r-tagline-font);line-height:1.05;margin:0">tagline</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- nav text links Partnerzy, Inwestorzy --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-kontakt region control" data-region="nav-kontakt"><!-- outlined black pill button Kontakt: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-kontakt); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-room-1 region plate" data-region="room-1"><img src="../../../assets/plates/room-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-room-2 region plate" data-region="room-2"><img src="../../../assets/plates/room-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-room-3 region plate" data-region="room-3"><img src="../../../assets/plates/room-3.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-room-4 region plate" data-region="room-4"><img src="../../../assets/plates/room-4.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-headline region text" data-region="headline"><!-- FRESH WHEN YOU NEED IT. white brush-style display caps running across all four rooms (measured on the first word FRESH over the cafe wall), NEED in italic serif; live HTML text --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-poche-texture region texture" data-region="poche-texture" style="background-image:url('../../../assets/plates/poche-texture.png');background-repeat:repeat"></div>
  <div class="r-brand-rail region text" data-region="brand-rail"><!-- monospaced caps FRESH FINGERS · CLEAN&GO · FRESHMATE · FINGER FRESH --><p style="font-size:var(--r-brand-rail-font);font-family:var(--r-brand-rail-family),sans-serif;font-weight:var(--r-brand-rail-weight);line-height:1.05;margin:0">brand-rail</p></div>
  <div class="r-rail-line region chrome" data-region="rail-line"><!-- thin black horizontal rule --></div>
  <div class="r-rail-marker region control" data-region="rail-marker"><!-- gold dot marker on the rule under FRESH FINGERS: rebuild the control's chrome from the crop (comp-spec.mjs --crop rail-marker); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-icon-alcohol region plate" data-region="icon-alcohol"><img src="../../../assets/plates/icon-alcohol.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-claim-alcohol region text" data-region="claim-alcohol"><!-- 0% ALKOHOLU monospaced caps --><p style="font-size:var(--r-claim-alcohol-font);line-height:1.05;margin:0">claim-alcohol</p></div>
  <figure class="r-icon-sugar region plate" data-region="icon-sugar"><img src="../../../assets/plates/icon-sugar.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-claim-sugar region text" data-region="claim-sugar"><!-- BEZ CUKRU monospaced caps --><p style="font-size:var(--r-claim-sugar-font);line-height:1.05;margin:0">claim-sugar</p></div>
  <figure class="r-icon-rinse region plate" data-region="icon-rinse"><img src="../../../assets/plates/icon-rinse.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-claim-rinse region text" data-region="claim-rinse"><!-- BEZ PŁUKANIA monospaced caps --><p style="font-size:var(--r-claim-rinse-font);line-height:1.05;margin:0">claim-rinse</p></div>
  <div class="r-subline region text" data-region="subline"><!-- Jeden produkt, cztery marki. sans --><p style="font-size:var(--r-subline-font);line-height:1.05;margin:0">subline</p></div>
  <div class="r-cta-deck region control" data-region="cta-deck"><!-- solid black pill button Pobierz deck white text: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-deck); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-kontakt region text" data-region="cta-kontakt"><!-- Kontakt → text link with arrow --><p style="font-size:var(--r-cta-kontakt-font);line-height:1.05;margin:0">cta-kontakt</p></div>
  <div class="r-caption region text" data-region="caption"><!-- ADA Group · Katowice small sans --><p style="font-size:var(--r-caption-font);line-height:1.05;margin:0">caption</p></div>
</main>
</body>
</html>
